name: Delivery

# What moves a change along once it is pushed or merged: it opens the pull requests, builds and validates
# a release, creates the draft and publishes it. Each plugin calls this from its own delivery.yml.
on:
  workflow_call:
    inputs:
      smoke-os:
        description: JSON list of the systems the zip must start on.
        type: string
        default: '["windows-latest","macos-latest"]'
      integrations-scripts:
        description: npm scripts to run before the draft, separated by spaces. Empty skips the job.
        type: string
        default: ''
      integrations-os:
        description: The system those scripts run on.
        type: string
        default: ubuntu-latest
      integrations-environment:
        description: The environment that holds their secret. Empty uses none.
        type: string
        default: ''
      integrations-secret:
        description: The name of the secret they read as an environment variable. Empty needs none.
        type: string
        default: ''
      publishing:
        description: Only the exact string true allows publishing after explicit maintainer approval.
        type: string
        default: 'false'
    secrets:
      APP_CLIENT_ID:
        description: The client ID of the GitHub App that does the writing. A fork does not have it.
        required: false
      APP_PRIVATE_KEY:
        description: The private key of that App.
        required: false

# The GitHub App does the writing, because a pull request opened with this workflow's own token leaves
# the Gate waiting for a click. The jobs that hold it run no npm, so nothing from a dependency runs next to it.
permissions:
  contents: read

jobs:
  next:
    name: Next step
    # A fork has no App secrets, and its author opens the pull request here by hand.
    if: ${{ !github.event.repository.fork && !github.event.deleted && !startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: ubuntu-latest
    env:
      # The client ID is not secret. A step's if cannot read secrets, but it can read this.
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
    steps:
      - id: app
        # A fork or Dependabot has no secrets, so this is skipped and the steps below find no token.
        if: ${{ env.APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Without the secret, checkout would stop with its own message, and the next step names what to set.
          token: ${{ steps.app.outputs.token || github.token }}
          # Only develop pushes anything with git: the bump/ branches.
          persist-credentials: ${{ github.ref_name == 'develop' }}
      # The same commit of the pipeline as this file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node .pipeline/scripts/flow.mjs next
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}

  build:
    name: Build
    # Creating a release branch from main is also a push, with nothing new to validate.
    if: ${{ !github.event.repository.fork && startsWith(github.ref, 'refs/heads/release/') && !github.event.created && !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: The branch must match every version in the repository
        run: node .pipeline/scripts/flow.mjs check-release
        env:
          BRANCH: ${{ github.ref_name }}
      # The secret scan below reads every file git would commit, and these are not the plugin's.
      - run: rm -rf .pipeline
      - run: npm run setup
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit
      - run: npm run --if-present check:licenses
      - run: npm run check:sdk
      - run: npm run package
      - run: npm run verify:package
      - run: npm run check:secrets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-zip
          path: dist/*.zip
          if-no-files-found: error

  smoke:
    name: Smoke (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The systems the plugin runs on, with the very zip that goes in the draft.
        os: ${{ fromJSON(inputs.smoke-os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-zip
          path: dist
      - run: npm run verify:package

  integrations:
    name: Integrations
    needs: build
    if: ${{ inputs.integrations-scripts != '' }}
    runs-on: ${{ inputs.integrations-os }}
    # An environment can give the secret to release/v* branches only, so no other branch's workflow can read it.
    # GitHub only hands environment secrets to a called workflow when its caller says "secrets: inherit".
    environment: ${{ inputs.integrations-environment }}
    env:
      INTEGRATIONS_SECRET: ${{ secrets[inputs.integrations-secret] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: A missing secret must stop here, because live tests skip without one and look like a pass
        if: inputs.integrations-secret != ''
        shell: bash
        env:
          SECRET_NAME: ${{ inputs.integrations-secret }}
          ENVIRONMENT: ${{ inputs.integrations-environment }}
        run: |
          if [ -z "$INTEGRATIONS_SECRET" ]; then
            echo "::error::$SECRET_NAME did not arrive. It must be set in the $ENVIRONMENT environment, and the plugin's delivery.yml must say \"secrets: inherit\". See its CONTRIBUTING.md."
            exit 1
          fi
          echo "$SECRET_NAME=$INTEGRATIONS_SECRET" >> "$GITHUB_ENV"
      - run: npm run setup
      - name: Run them
        shell: bash
        env:
          SCRIPTS: ${{ inputs.integrations-scripts }}
        run: |
          for script in $SCRIPTS; do
            npm run "$script"
          done

  measure:
    name: Measure
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run setup
      - shell: bash
        run: |
          mkdir measure
          npm run --silent measure | tee measure/measure.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measure
          path: measure/measure.txt
          if-no-files-found: error

  draft:
    name: Draft and pull request to main
    needs: [smoke, integrations, measure]
    # Integrations may only be skipped when this plugin has none. On any other branch the rest is skipped too.
    if: ${{ !cancelled() && needs.smoke.result == 'success' && needs.measure.result == 'success' && (needs.integrations.result == 'success' || (needs.integrations.result == 'skipped' && inputs.integrations-scripts == '')) }}
    runs-on: ubuntu-latest
    env:
      # The client ID is not secret. A step's if cannot read secrets, but it can read this.
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
    steps:
      - id: app
        # A fork or Dependabot has no secrets, so this is skipped and the steps below find no token.
        if: ${{ env.APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-zip
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: measure
          path: measure
      - name: Create or update the draft, and open the pull request to main
        # A draft on purpose: a person tests it on a real deck before merging into main publishes it.
        run: |
          (cd dist && sha256sum ./*.zip > SHA256SUMS.txt)
          node .pipeline/scripts/flow.mjs draft-release
          node .pipeline/scripts/flow.mjs open-main-pull-request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
